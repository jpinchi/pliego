<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pliego</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  background:#0d1018;
  overflow:hidden;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

.wrap{
  width:100%;height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  position:relative;
}

/* Logo */
.logo{
  width:64px;height:64px;
  border-radius:16px;
  background:linear-gradient(145deg,#f5b030,#d87010);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:800;
  color:#1a1206;
  letter-spacing:-2px;
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  opacity:0;
  transform:translateY(8px);
  animation:up 380ms 100ms cubic-bezier(.22,1,.36,1) forwards;
}

.name{
  margin-top:16px;
  font-size:22px;font-weight:600;
  color:#dde0e8;
  letter-spacing:-.3px;
  opacity:0;
  transform:translateY(6px);
  animation:up 340ms 240ms cubic-bezier(.22,1,.36,1) forwards;
}

.sub{
  margin-top:3px;
  font-size:10.5px;font-weight:400;
  letter-spacing:1.4px;text-transform:uppercase;
  color:#3d4455;
  opacity:0;
  animation:fade 300ms 380ms ease forwards;
}

/* Barra de progreso */
.bar-wrap{
  position:absolute;
  bottom:0;left:0;right:0;
  height:2px;
  background:#161a24;
}
.bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,#c07010,#f0a020);
  animation:load 1600ms 300ms cubic-bezier(.4,0,.2,1) forwards;
}

@keyframes up{
  to{opacity:1;transform:translateY(0)}
}
@keyframes fade{
  to{opacity:1}
}
@keyframes load{
  0%  {width:0%}
  50% {width:60%}
  80% {width:85%}
  100%{width:100%}
}

body.out .wrap{
  animation:fadeout 240ms ease forwards;
}
@keyframes fadeout{
  to{opacity:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">P</div>
  <div class="name">Pliego</div>
  <div class="sub">PDF Editor</div>
</div>
<div class="bar-wrap"><div class="bar"></div></div>

<script>
  if(window.splashBridge){
    window.splashBridge.onReady(()=>{
      document.body.classList.add("out");
      setTimeout(()=>window.splashBridge.close(), 240);
    });
  } else {
    setTimeout(()=>document.body.classList.add("out"), 2000);
  }
</script>
</body>
</html>
