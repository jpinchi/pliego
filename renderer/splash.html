<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Pliego</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #080b10;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* Patrón de puntos sutil en el fondo */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  /* Resplandor ambar de fondo */
  body::after {
    content: '';
    position: fixed;
    width: 300px; height: 200px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(240,160,32,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Tarjeta principal */
  .card {
    position: absolute;
    inset: 16px;
    background: linear-gradient(145deg, #151b26 0%, #0f1319 60%, #0c1018 100%);
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 2px 4px rgba(0,0,0,0.4),
      0 8px 32px rgba(0,0,0,0.5),
      0 32px 64px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.94) translateY(8px);
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }

  /* Línea decorativa superior */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,160,32,0.5), transparent);
    border-radius: 1px;
    opacity: 0;
    animation: lineIn 0.6s ease 0.4s forwards;
  }

  /* Contenedor logo con halo */
  .logo-wrap {
    position: relative;
    margin-bottom: 22px;
    opacity: 0;
    transform: scale(0.7) translateY(4px);
    animation: logoIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s forwards;
  }

  /* Halo exterior */
  .logo-wrap::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 28px;
    background: radial-gradient(ellipse at center, rgba(240,160,32,0.18) 0%, transparent 70%);
    animation: haloPulse 2.5s ease-in-out 0.7s infinite;
  }

  /* Anillo fino */
  .logo-wrap::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 24px;
    border: 1px solid rgba(240,160,32,0.2);
  }

  .logo {
    width: 76px; height: 76px;
    background: linear-gradient(145deg, #f5b030 0%, #e89010 50%, #d07808 100%);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; color: #0d1018;
    letter-spacing: -2px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(240,160,32,0.3),
      0 4px 12px rgba(240,160,32,0.4),
      0 8px 32px rgba(240,160,32,0.25),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -2px 0 rgba(0,0,0,0.2);
  }

  /* Brillo interno del logo */
  .logo::after {
    content: '';
    position: absolute;
    top: 4px; left: 6px; right: 6px;
    height: 30%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.25), transparent);
    border-radius: 8px 8px 50% 50%;
  }

  .app-name {
    font-size: 26px; font-weight: 700;
    color: #eef0f5;
    letter-spacing: -0.8px;
    line-height: 1;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.36s forwards;
    margin-bottom: 6px;
  }

  .app-sub {
    font-size: 10.5px; font-weight: 500;
    color: rgba(255,255,255,0.25);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.46s forwards;
    margin-bottom: 32px;
  }

  /* Barra de progreso */
  .bar-wrap {
    width: 160px;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.4s ease 0.56s forwards;
  }

  .bar-track {
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
    width: 0%;
    background: linear-gradient(90deg, #c07010, #f0a020, #f5c040);
    box-shadow: 0 0 8px rgba(240,160,32,0.6);
    animation: progress var(--dur, 1.9s) cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.65s forwards;
  }

  /* Versión */
  .version {
    position: absolute;
    bottom: 18px;
    right: 22px;
    font-size: 9.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.13);
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    animation: fadeUp 0.4s ease 0.7s forwards;
  }

  /* ── Keyframes ── */
  @keyframes cardIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes lineIn {
    to { opacity: 1; }
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes progress {
    0%   { width: 0%; }
    40%  { width: 55%; }
    70%  { width: 80%; }
    90%  { width: 94%; }
    100% { width: 100%; }
  }
  @keyframes haloPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(1.08); }
  }

  /* Fade-out de salida */
  .card.out {
    animation: cardOut 0.3s cubic-bezier(0.4, 0, 1, 1) forwards !important;
  }
  @keyframes cardOut {
    to { opacity: 0; transform: scale(0.96) translateY(-6px); }
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo-wrap">
    <div class="logo">P</div>
  </div>
  <div class="app-name">Pliego</div>
  <div class="app-sub">PDF Editor</div>
  <div class="bar-wrap">
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
  </div>
  <div class="version" id="ver"></div>
</div>

<script>
(function () {
  var quiet = new URLSearchParams(location.search).get("quiet") === "1";
  var ver   = new URLSearchParams(location.search).get("v") || "";
  var card  = document.getElementById("card");

  if (ver) document.getElementById("ver").textContent = "v" + ver;
  card.style.setProperty("--dur", quiet ? "1.1s" : "1.9s");

  // Avisar al main: DOM listo, mostrar ventana
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      if (window.splashBridge) window.splashBridge.ready();
    });
  });

  var totalMs = quiet ? 1700 : 2600;
  setTimeout(function () {
    card.classList.add("out");
    setTimeout(function () {
      if (window.splashBridge) window.splashBridge.done();
    }, 300);
  }, totalMs);
})();
</script>
</body>
</html>
