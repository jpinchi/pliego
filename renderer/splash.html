<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Pliego</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0d1018;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Tarjeta centrada */
  .card {
    position: absolute;
    inset: 20px;
    background: #131720;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 24px 64px rgba(0,0,0,0.7),
      0 4px 16px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    opacity: 0;
    transform: scale(0.96) translateY(6px);
    animation: cardIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }

  /* Logo */
  .logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #f0a020 0%, #f5c040 100%);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 800; color: #0d1018;
    letter-spacing: -1px;
    box-shadow: 0 8px 24px rgba(240,160,32,0.35), 0 2px 8px rgba(240,160,32,0.2);
    opacity: 0;
    transform: scale(0.8);
    animation: logoIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.18s forwards;
    margin-bottom: 20px;
  }

  .app-name {
    font-size: 24px; font-weight: 700;
    color: #e2e4eb;
    letter-spacing: -0.5px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.3s ease 0.32s forwards;
    margin-bottom: 4px;
  }

  .app-sub {
    font-size: 12px; font-weight: 400;
    color: #4a5060;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.3s ease 0.42s forwards;
    margin-bottom: 28px;
  }

  /* Barra de progreso */
  .bar-track {
    width: 180px; height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.3s ease 0.52s forwards;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f0a020, #f5c040);
    border-radius: 2px;
    width: 0%;
    animation: progress var(--dur, 1.8s) cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
  }

  /* ── Animaciones ── */
  @keyframes cardIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes progress {
    0%   { width: 0%; }
    60%  { width: 72%; }
    85%  { width: 91%; }
    100% { width: 100%; }
  }

  /* Fade out de toda la tarjeta */
  .card.fade-out {
    animation: cardOut 0.25s ease forwards;
  }
  @keyframes cardOut {
    to { opacity: 0; transform: scale(0.97) translateY(-4px); }
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">P</div>
  <div class="app-name">Pliego</div>
  <div class="app-sub">PDF editor</div>
  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
</div>

<script>
(function () {
  var quiet = new URLSearchParams(location.search).get("quiet") === "1";
  var card  = document.getElementById("card");

  // Duración de la barra: 1.2s (quiet) o 1.8s (full)
  card.style.setProperty("--dur", quiet ? "1.1s" : "1.8s");

  // Avisar al main: la animación comenzó, mostrar ventana
  function ready() {
    if (window.splashBridge) window.splashBridge.ready();
  }

  // Avisar al main: animación terminada, cerrar splash
  function done() {
    card.classList.add("fade-out");
    setTimeout(function () {
      if (window.splashBridge) window.splashBridge.done();
    }, 250);
  }

  // Enviar ready en el próximo frame (DOM pintado)
  requestAnimationFrame(function () {
    requestAnimationFrame(ready);
  });

  // La duración total: 0.6s delay + duración barra + 0.4s extra
  var totalMs = quiet ? 1800 : 2500;
  setTimeout(done, totalMs);
})();
</script>
</body>
</html>
