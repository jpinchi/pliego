<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pliego</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:     #0e1117;
  --chrome: #181c25;
  --accent: #f0a020;
  --accent2:#ffcc60;
  --ink:    #e7e9ee;
  --muted:  #5a6070;
  --line:   #1e2230;
  --glow:   rgba(240,160,32,.22);
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  overflow:hidden;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

.window{
  width:100%;height:100%;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* Grid de fondo */
.grid-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:32px 32px;
  opacity:0;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
  animation:gridIn 800ms 80ms ease forwards;
}

/* Línea superior con sweep */
.topline{
  position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 40%,var(--accent2) 60%,transparent 100%);
  transform:scaleX(0);
  transform-origin:center;
  animation:lineIn 700ms 120ms cubic-bezier(.22,1,.36,1) forwards;
  box-shadow:0 0 12px 1px rgba(240,160,32,.5);
}

/* Glow grande centrado */
.glow-orb{
  position:absolute;
  width:320px;height:200px;
  border-radius:50%;
  background:radial-gradient(ellipse at center,var(--glow) 0%,transparent 70%);
  top:50%;left:50%;
  transform:translate(-50%,-62%);
  opacity:0;
  animation:glowIn 700ms 200ms ease forwards;
}

/* Anillo giratorio alrededor del logo */
.ring-wrap{
  position:relative;z-index:2;
  width:96px;height:96px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  animation:ringFadeIn 400ms 280ms ease forwards;
}

.ring{
  position:absolute;inset:-6px;
  border-radius:28px;
  border:1.5px solid transparent;
  background:
    linear-gradient(var(--bg),var(--bg)) padding-box,
    conic-gradient(from 0deg,var(--accent) 0%,var(--accent2) 30%,transparent 60%) border-box;
  animation:spin 2400ms linear infinite;
}
.ring-2{
  position:absolute;inset:-10px;
  border-radius:32px;
  border:1px solid transparent;
  background:
    linear-gradient(var(--bg),var(--bg)) padding-box,
    conic-gradient(from 180deg,var(--accent) 0%,transparent 40%) border-box;
  opacity:.35;
  animation:spin 3600ms linear infinite reverse;
}

/* Logo */
.logo{
  position:relative;z-index:3;
  width:76px;height:76px;border-radius:20px;
  background:linear-gradient(145deg,#f5b030 0%,#d87010 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 8px 24px rgba(240,140,20,.4),
    0 2px 6px rgba(0,0,0,.5);
  font-size:48px;font-weight:800;color:#1a1206;
  letter-spacing:-3px;
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  opacity:0;transform:scale(.55) translateY(6px);
  animation:logoIn 550ms 300ms cubic-bezier(.34,1.56,.64,1) forwards;
}

/* Textos */
.text-group{
  margin-top:22px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  position:relative;z-index:2;
}

.app-name{
  font-size:26px;font-weight:700;
  color:var(--ink);letter-spacing:-.4px;
  opacity:0;transform:translateY(12px);
  animation:textIn 480ms 450ms cubic-bezier(.22,1,.36,1) forwards;
}

.tagline{
  font-size:11px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);
  opacity:0;
  animation:fadeIn 400ms 580ms ease forwards;
}

/* Barra de progreso */
.progress-area{
  position:absolute;bottom:28px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;
  animation:fadeIn 300ms 620ms ease forwards;
}

.progress-wrap{
  width:160px;height:2px;
  background:var(--line);border-radius:99px;overflow:hidden;
}
.progress-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;
  box-shadow:0 0 8px 1px rgba(240,160,32,.6);
  animation:progress 1500ms 680ms cubic-bezier(.4,0,.15,1) forwards;
}

.version{
  font-size:10px;color:var(--muted);letter-spacing:.4px;
  opacity:.7;
}

/* Esquinas decorativas */
.corner{
  position:absolute;width:10px;height:10px;
  opacity:0;
  animation:fadeIn 400ms 200ms ease forwards;
}
.corner::before,.corner::after{
  content:'';position:absolute;background:rgba(240,160,32,.4);
}
.corner::before{height:1px;width:100%}
.corner::after{width:1px;height:100%}
.corner.tl{top:10px;left:10px}
.corner.tl::before{top:0;left:0}
.corner.tl::after{top:0;left:0}
.corner.tr{top:10px;right:10px}
.corner.tr::before{top:0;right:0}
.corner.tr::after{top:0;right:0}
.corner.bl{bottom:10px;left:10px}
.corner.bl::before{bottom:0;left:0}
.corner.bl::after{bottom:0;left:0}
.corner.br{bottom:10px;right:10px}
.corner.br::before{bottom:0;right:0}
.corner.br::after{bottom:0;right:0}

/* Keyframes */
@keyframes gridIn{to{opacity:.45}}
@keyframes glowIn{to{opacity:1}}
@keyframes lineIn{to{transform:scaleX(1)}}
@keyframes ringFadeIn{to{opacity:1}}
@keyframes logoIn{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes textIn{to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes progress{
  0%  {width:0%}
  55% {width:68%}
  80% {width:87%}
  100%{width:100%}
}

/* Fade-out al cerrar */
body.closing .window{
  animation:windowOut 260ms cubic-bezier(.4,0,1,1) forwards;
}
@keyframes windowOut{
  to{opacity:0;transform:scale(.96)}
}
</style>
</head>
<body>
<div class="window">
  <div class="grid-bg"></div>
  <div class="topline"></div>
  <div class="glow-orb"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="ring-wrap">
    <div class="ring"></div>
    <div class="ring-2"></div>
    <div class="logo">P</div>
  </div>

  <div class="text-group">
    <div class="app-name">Pliego</div>
    <div class="tagline">PDF Editor</div>
  </div>

  <div class="progress-area">
    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="version">v1.0.0</div>
  </div>
</div>

<script>
  if(window.splashBridge){
    window.splashBridge.onReady(()=>{
      document.body.classList.add("closing");
      setTimeout(()=>window.splashBridge.close(), 260);
    });
  } else {
    setTimeout(()=>document.body.classList.add("closing"), 2400);
  }
</script>
</body>
</html>
