<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Pliego</title>
<style>
  /* Tokens idénticos a pliego-pdf.html ("drafting studio" acero + ámbar) */
  :root {
    --bg:     #20242c;
    --line:   #363c47;
    --ink:    #e7e9ee;
    --muted:  #8a909e;
    --track:  rgba(255,255,255,.06);
    --accent: #f0a020;
    --accent-2: #c97f12;
    --ui:   "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

    --ease-out:    cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.34, 1.36, .64, 1);
    --ease-in:     cubic-bezier(.4, 0, 1, 1);
    --enter: 420ms;
    --exit:  260ms;
  }
  :root.light {
    --bg:     #ffffff;
    --line:   #d6dae1;
    --ink:    #1c2128;
    --muted:  #5b6270;
    --track:  rgba(0,0,0,.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .frame {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity var(--exit) var(--ease-in), transform var(--exit) var(--ease-in);
  }
  .frame.out { opacity: 0; transform: scale(.985); }

  .enter {
    opacity: 0;
    transform: translateY(8px);
    animation: enter var(--enter) var(--ease-out) forwards;
    animation-delay: calc(80ms + var(--i, 0) * 50ms);
  }

  .logo {
    width: 64px; height: 64px;
    margin-bottom: 20px;
    transform: scale(.88);
    animation-name: logo;
    animation-timing-function: var(--ease-spring);
    filter: drop-shadow(0 6px 14px rgba(240,160,32,.22));
  }

  .name {
    font-size: 30px; font-weight: 650;
    letter-spacing: -.02em; line-height: 1.1;
  }

  .sub {
    margin-top: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    letter-spacing: .01em;
  }

  .footer {
    position: absolute; left: 24px; right: 24px; bottom: 20px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--muted);
  }
  .version { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Indicador de carga indeterminado en el borde inferior */
  .progress {
    position: absolute; left: 1px; right: 1px; bottom: 1px;
    height: 2px; overflow: hidden;
    background: var(--track);
  }
  .progress::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 32%;
    background: linear-gradient(90deg, transparent, var(--accent) 40%, var(--accent) 60%, transparent);
    transform: translateX(-100%);
    animation: sweep 1.25s linear 300ms infinite;
  }

  @keyframes enter { to { opacity: 1; transform: none; } }
  @keyframes logo  { to { opacity: 1; transform: none; } }
  @keyframes sweep { to { transform: translateX(320%); } }

  /* Movimiento reducido: solo fundidos */
  :root.calm .enter, :root.calm .logo { transform: none; animation-name: fade; animation-timing-function: ease-out; }
  :root.calm .frame.out { transform: none; }
  :root.calm .progress::after { animation: none; width: 100%; transform: none; opacity: .5; }
  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .enter, .logo { transform: none; animation-name: fade; }
    .frame.out { transform: none; }
    .progress::after { animation: none; width: 100%; transform: none; opacity: .5; }
  }
</style>
</head>
<body>
<main class="frame" id="frame" role="status" aria-live="polite" aria-busy="true">
  <svg class="logo enter" style="--i:0" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2=".45" y2="1">
        <stop offset="0" stop-color="#f2a524"/>
        <stop offset="1" stop-color="#c97f12"/>
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="15" fill="url(#g)"/>
    <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="rgba(255,255,255,.18)"/>
    <path fill="#1a1206" d="M21.1 16.3h12.6c8.4 0 13.2 4.3 13.2 11.5s-4.8 11.4-13.2 11.4h-5.3v8.6h-7.3V16.3zm7.3 6.1v10.8h4.9c3.8 0 5.9-1.9 5.9-5.4s-2.1-5.4-5.9-5.4h-4.9z"/>
  </svg>
  <h1 class="name enter" style="--i:1">Pliego</h1>
  <p class="sub enter" id="sub" style="--i:2">Editor de PDF</p>

  <div class="footer enter" style="--i:3">
    <span id="status">Preparando el editor…</span>
    <span class="version" id="ver"></span>
  </div>
  <div class="progress" aria-hidden="true"></div>
</main>

<script>
(function () {
  var root   = document.documentElement;
  var params = new URLSearchParams(location.search);
  var quiet  = params.get("quiet") === "1";
  var ver    = params.get("v") || "";

  var theme = "dark", lang = "es";
  try { theme = localStorage.getItem("pliego_theme") || "dark"; } catch (_) {}
  try { lang  = localStorage.getItem("pliego_lang")  || "es";   } catch (_) {}

  if (theme === "light") root.classList.add("light");
  if (quiet) root.classList.add("calm");

  var copy = {
    es: { sub: "Editor de PDF", status: "Preparando el editor…" },
    en: { sub: "PDF editor",    status: "Getting things ready…" }
  }[lang] || null;
  if (copy) {
    root.lang = lang;
    document.getElementById("sub").textContent    = copy.sub;
    document.getElementById("status").textContent = copy.status;
  }
  if (ver) document.getElementById("ver").textContent = "v" + ver;

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      if (window.splashBridge) window.splashBridge.ready();
    });
  });

  // Tiempo mínimo en pantalla; el main decide cuándo desvanecer (cuando la app ya está lista)
  var holdMs = quiet ? 1400 : 2200;
  setTimeout(function () {
    if (window.splashBridge) window.splashBridge.done();
  }, holdMs);
  if (window.splashBridge && window.splashBridge.onFade) {
    window.splashBridge.onFade(function () {
      document.getElementById("frame").classList.add("out");
    });
  }
})();
</script>
</body>
</html>
