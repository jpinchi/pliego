<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Pliego</title>
<style>
  /* Tokens idénticos a pliego-pdf.html ("drafting studio" acero + ámbar) */
  :root {
    --bg:     #20242c;
    --line:   #363c47;
    --ink:    #e7e9ee;
    --muted:  #8a909e;
    --track:  rgba(255,255,255,.08);
    --accent: #f0a020;
    --ui:   "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

    --ease-out:    cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.34, 1.36, .64, 1);
    --enter: 420ms;
    --bar:   420ms;
  }
  :root.light {
    --bg:     #ffffff;
    --line:   #d6dae1;
    --ink:    #1c2128;
    --muted:  #5b6270;
    --track:  rgba(0,0,0,.07);
    --accent: #e8951a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .frame {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 12px;
  }

  .enter {
    opacity: 0;
    transform: translateY(8px);
    animation: enter var(--enter) var(--ease-out) forwards;
    animation-delay: calc(60ms + var(--i, 0) * 50ms);
  }

  .logo {
    width: 64px; height: 64px;
    margin-bottom: 18px;
    transform: scale(.88);
    animation-timing-function: var(--ease-spring);
    filter: drop-shadow(0 6px 14px rgba(240,160,32,.22));
  }

  .name {
    font-size: 30px; font-weight: 650;
    letter-spacing: -.02em; line-height: 1.1;
  }

  .sub {
    margin-top: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    letter-spacing: .01em;
  }

  /* Barra de carga: refleja el progreso real de la app */
  .bar {
    margin-top: 26px;
    width: 220px; height: 4px;
    border-radius: 2px;
    background: var(--track);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 100%;
    border-radius: 2px;
    background: var(--accent);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform var(--bar) var(--ease-out);
  }

  .footer {
    position: absolute; left: 24px; right: 24px; bottom: 20px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--muted);
  }
  .version { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  @keyframes enter { to { opacity: 1; transform: none; } }
  @keyframes fade  { to { opacity: 1; } }

  /* Movimiento reducido: la entrada es solo un fundido; la barra sigue avanzando porque informa */
  :root.calm .enter { transform: none; animation-name: fade; animation-timing-function: ease-out; }
  :root.calm { --bar: 220ms; }
  @media (prefers-reduced-motion: reduce) {
    .enter { transform: none; animation-name: fade; }
    :root { --bar: 220ms; }
  }
</style>
</head>
<body>
<main class="frame" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="frame">
  <svg class="logo enter" style="--i:0" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2=".45" y2="1">
        <stop offset="0" stop-color="#f2a524"/>
        <stop offset="1" stop-color="#c97f12"/>
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="15" fill="url(#g)"/>
    <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="rgba(255,255,255,.18)"/>
    <path fill="#1a1206" d="M21.1 16.3h12.6c8.4 0 13.2 4.3 13.2 11.5s-4.8 11.4-13.2 11.4h-5.3v8.6h-7.3V16.3zm7.3 6.1v10.8h4.9c3.8 0 5.9-1.9 5.9-5.4s-2.1-5.4-5.9-5.4h-4.9z"/>
  </svg>
  <h1 class="name enter" style="--i:1">Pliego</h1>
  <p class="sub enter" id="sub" style="--i:2">Editor de PDF</p>
  <div class="bar enter" style="--i:3"><div class="bar-fill" id="fill"></div></div>

  <div class="footer enter" style="--i:4">
    <span id="status">Iniciando…</span>
    <span class="version" id="ver"></span>
  </div>
</main>

<script>
(function () {
  var root   = document.documentElement;
  var params = new URLSearchParams(location.search);
  var quiet  = params.get("quiet") === "1";
  var ver    = params.get("v") || "";

  var theme = "dark", lang = "es";
  try { theme = localStorage.getItem("pliego_theme") || "dark"; } catch (_) {}
  try { lang  = localStorage.getItem("pliego_lang")  || "es";   } catch (_) {}
  if (lang !== "en") lang = "es";

  if (theme === "light") root.classList.add("light");
  if (quiet) root.classList.add("calm");

  var copy = {
    es: { sub: "Editor de PDF", start: "Iniciando…", loading: "Cargando el editor…", tools: "Preparando herramientas…", done: "Listo" },
    en: { sub: "PDF editor",    start: "Starting…",  loading: "Loading the editor…", tools: "Preparing tools…",        done: "Ready" }
  }[lang];
  root.lang = lang;
  document.getElementById("sub").textContent = copy.sub;
  document.getElementById("status").textContent = copy.start;
  if (ver) document.getElementById("ver").textContent = "v" + ver;

  var frame  = document.getElementById("frame");
  var fill   = document.getElementById("fill");
  var status = document.getElementById("status");
  var target = 0, shown = 0, finished = false;

  function paint() {
    fill.style.transform = "scaleX(" + shown.toFixed(3) + ")";
    frame.setAttribute("aria-valuenow", Math.round(shown * 100));
  }

  // Avance lento entre etapas para que la barra no se quede quieta
  var creep = setInterval(function () {
    if (finished) return;
    var cap = Math.min(0.94, target + 0.1);
    if (shown < cap) { shown = Math.min(cap, shown + 0.012); paint(); }
  }, 120);

  var bridge = window.splashBridge;
  if (bridge) {
    bridge.onProgress(function (d) {
      if (finished || d.p <= target) return;
      target = d.p;
      if (shown < target) shown = target;
      if (copy[d.stage]) status.textContent = copy[d.stage];
      paint();
    });
    bridge.onFinish(function () {
      finished = true;
      clearInterval(creep);
      shown = 1;
      status.textContent = copy.done;
      // El último tramo siempre se ve subir, también con animaciones reducidas
      fill.style.transitionDuration = "450ms";
      paint();
      setTimeout(function () { bridge.done(); }, 450 + 200);
    });
  }

  // Avisar al main en cuanto el primer frame esté pintado
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { if (bridge) bridge.ready(); });
  });
})();
</script>
</body>
</html>
